<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusFlow AI</title>
  <style>
    body {
      width: 320px;
      height: 400px;
      margin: 0;
      padding: 20px;
      background: #0a0a0b;
      color: #f3f4f6;
      font-family: ui-sans-serif, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .logo {
      width: 32px;
      height: 32px;
      margin: 0 auto 10px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }
    
    .title {
      font-size: 18px;
      font-weight: bold;
      color: white;
      margin-bottom: 4px;
    }
    
    .subtitle {
      font-size: 12px;
      color: #9ca3af;
    }
    
    .button {
      width: 100%;
      padding: 16px;
      background: #111214;
      border: 1px solid #26272b;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
      font-size: 14px;
    }
    
    .button:hover {
      background: #17181c;
      transform: translateY(-1px);
    }
    
    .button-icon {
      width: 16px;
      height: 16px;
      background: #3b82f6;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 10px;
    }
    
    .button-icon.research {
      background: #10b981;
    }
    
    .button-text {
      flex: 1;
      text-align: left;
    }
    
    .button-title {
      font-weight: 600;
      margin-bottom: 2px;
    }
    
    .button-desc {
      font-size: 11px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">F</div>
    <div class="title">FocusFlow AI</div>
    <div class="subtitle">Intelligent Web Assistant</div>
  </div>
  
  <button id="openAide" class="button">
    <div class="button-icon">A</div>
    <div class="button-text">
      <div class="button-title">Aide</div>
      <div class="button-desc">Open contextual sidebar</div>
    </div>
  </button>
  
  <button id="openResearchHub" class="button">
    <div class="button-icon research">R</div>
    <div class="button-text">
      <div class="button-title">Research Hub</div>
      <div class="button-desc">Open full workspace</div>
    </div>
  </button>
  
  <script src="popup.js"></script>
</body>
</html>
