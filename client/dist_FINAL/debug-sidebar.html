<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusFlow AI - Sidebar Debug</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #fff;
    }
    .debug-section {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #333;
      border-radius: 8px;
    }
    .test-button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin: 10px 5px;
    }
    .test-button:hover {
      background: #2563eb;
    }
    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
    }
    .success { background: #10b981; }
    .error { background: #ef4444; }
    .warning { background: #f59e0b; }
    .iframe-test {
      width: 400px;
      height: 300px;
      border: 2px solid #666;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h1>🔍 FocusFlow AI Sidebar Debug</h1>
  
  <div class="debug-section">
    <h2>Extension Status</h2>
    <div id="extension-status">Checking...</div>
  </div>

  <div class="debug-section">
    <h2>Asset Loading Test</h2>
    <button class="test-button" onclick="testAssetLoading()">Test Asset Loading</button>
    <div id="asset-status"></div>
  </div>

  <div class="debug-section">
    <h2>Iframe Test</h2>
    <button class="test-button" onclick="testIframe()">Create Test Iframe</button>
    <div id="iframe-container"></div>
  </div>

  <div class="debug-section">
    <h2>Manual Sidebar Test</h2>
    <button class="test-button" onclick="createManualSidebar()">Create Manual Sidebar</button>
    <div id="manual-sidebar-container"></div>
  </div>

  <script>
    // Check extension availability
    function checkExtension() {
      const status = document.getElementById('extension-status');
      
      if (typeof chrome !== 'undefined' && chrome.runtime) {
        status.innerHTML = '<div class="status success">✅ Chrome Extension API Available</div>';
        status.innerHTML += '<div>Extension ID: ' + chrome.runtime.id + '</div>';
        status.innerHTML += '<div>Extension URL: ' + chrome.runtime.getURL('') + '</div>';
      } else {
        status.innerHTML = '<div class="status error">❌ Chrome Extension API Not Available</div>';
      }
    }

    // Test asset loading
    function testAssetLoading() {
      const status = document.getElementById('asset-status');
      status.innerHTML = '<div class="status warning">⏳ Testing asset loading...</div>';

      // Test main HTML
      fetch(chrome.runtime.getURL('index.html'))
        .then(response => {
          if (response.ok) {
            status.innerHTML += '<div class="status success">✅ index.html loads correctly</div>';
          } else {
            status.innerHTML += '<div class="status error">❌ index.html failed to load</div>';
          }
        })
        .catch(error => {
          status.innerHTML += '<div class="status error">❌ index.html network error: ' + error.message + '</div>';
        });

      // Test CSS asset
      fetch(chrome.runtime.getURL('./assets/index.css'))
        .then(response => {
          if (response.ok) {
            status.innerHTML += '<div class="status success">✅ CSS loads correctly</div>';
          } else {
            status.innerHTML += '<div class="status error">❌ CSS failed to load</div>';
          }
        })
        .catch(error => {
          status.innerHTML += '<div class="status error">❌ CSS network error: ' + error.message + '</div>';
        });

      // Test JS asset
      fetch(chrome.runtime.getURL('./assets/index.js'))
        .then(response => {
          if (response.ok) {
            status.innerHTML += '<div class="status success">✅ JS loads correctly</div>';
          } else {
            status.innerHTML += '<div class="status error">❌ JS failed to load</div>';
          }
        })
        .catch(error => {
          status.innerHTML += '<div class="status error">❌ JS network error: ' + error.message + '</div>';
        });
    }

    // Test iframe creation
    function testIframe() {
      const container = document.getElementById('iframe-container');
      container.innerHTML = '';

      const iframe = document.createElement('iframe');
      iframe.src = chrome.runtime.getURL('index.html?mode=sidebar');
      iframe.style.cssText = 'width: 400px; height: 300px; border: 2px solid #666;';
      iframe.className = 'iframe-test';

      iframe.onload = () => {
        console.log('✅ Test iframe loaded successfully');
        container.innerHTML += '<div class="status success">✅ Iframe loaded successfully</div>';
      };

      iframe.onerror = (error) => {
        console.error('❌ Test iframe failed to load:', error);
        container.innerHTML += '<div class="status error">❌ Iframe failed to load</div>';
      };

      container.appendChild(iframe);
      container.innerHTML += '<div class="status warning">⏳ Loading iframe...</div>';
    }

    // Create manual sidebar without Shadow DOM
    function createManualSidebar() {
      const container = document.getElementById('manual-sidebar-container');
      container.innerHTML = '';

      // Create host
      const host = document.createElement('div');
      host.id = 'manual-sidebar-host';
      host.style.cssText = `
        position: fixed;
        top: 0;
        right: 0;
        width: 400px;
        height: 100vh;
        background: #0a0a0b;
        border: 1px solid #26272b;
        z-index: 2147483647;
        transform: translateX(0);
        transition: transform 0.3s ease;
      `;

      // Create toggle button
      const toggle = document.createElement('button');
      toggle.innerHTML = '◀';
      toggle.style.cssText = `
        position: absolute;
        left: -40px;
        top: 50%;
        transform: translateY(-50%);
        width: 40px;
        height: 60px;
        background: #111214;
        border: 1px solid #26272b;
        border-right: none;
        border-radius: 8px 0 0 8px;
        color: #9ca3af;
        cursor: pointer;
        font-size: 18px;
      `;

      let isOpen = true;
      toggle.onclick = () => {
        isOpen = !isOpen;
        host.style.transform = isOpen ? 'translateX(0)' : 'translateX(100%)';
        toggle.innerHTML = isOpen ? '◀' : '▶';
      };

      // Create iframe
      const iframe = document.createElement('iframe');
      iframe.src = chrome.runtime.getURL('index.html?mode=sidebar');
      iframe.style.cssText = `
        width: 100%;
        height: 100%;
        border: none;
        background: #0a0a0b;
      `;

      iframe.onload = () => {
        console.log('✅ Manual iframe loaded successfully');
        container.innerHTML += '<div class="status success">✅ Manual sidebar iframe loaded</div>';
      };

      iframe.onerror = (error) => {
        console.error('❌ Manual iframe failed to load:', error);
        container.innerHTML += '<div class="status error">❌ Manual iframe failed to load</div>';
      };

      host.appendChild(toggle);
      host.appendChild(iframe);
      document.body.appendChild(host);

      container.innerHTML += '<div class="status success">✅ Manual sidebar created (without Shadow DOM)</div>';
      container.innerHTML += '<div class="status warning">⚠️ Click toggle button to test</div>';
    }

    // Initialize
    checkExtension();
  </script>
</body>
</html>
